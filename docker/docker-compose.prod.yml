# Ozituma — production stack, one host.
#
# Three containers: Postgres, the application image, and Caddy terminating TLS
# in front of it. Deliberately the same shape as docker-compose.yml so the
# production topology is one you have already run locally, just without MinIO —
# media lives in Cloudflare R2 in production, reached through the same
# S3-compatible code path the local stack exercises.
#
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# Configuration comes from /opt/ozituma/.env, written at boot from Secrets
# Manager rather than baked into the image or the instance metadata.
#
# Postgres is not published. Only Caddy binds host ports, so the database and
# the app are unreachable from outside the compose network.

name: ozituma

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ozituma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ozituma
      # C collation keeps ORDER BY stable and index-friendly for the
      # diacritic-bearing headwords we sort. Must match how the data was
      # imported, or ordering and unique indexes drift.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      # A bind mount onto the root EBS volume, not a named volume, so it is
      # visible to the host for snapshotting and easy to inspect.
      - /opt/ozituma/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ozituma -d ozituma']
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # The dictionary's own build target, so `--target web` never builds the archive, and building
      # the archive never builds this. The third target, `learn`, has been removed.
      target: web
    image: ozituma-web:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ozituma:${POSTGRES_PASSWORD}@postgres:5432/ozituma
      OZITUMA_SITE_URL: ${OZITUMA_SITE_URL:-https://ozituma.com}
      NODE_ENV: production
      # Media: Cloudflare R2 via the S3-compatible API. R2 charges no egress,
      # which is what makes 46,419 audio files affordable to serve.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL}
      # Donations. Only the SECRET key appears here: this uses Paystack's redirect
      # flow, where the amount is fixed server-side and the checkout page is hosted
      # by Paystack, so the public key is never needed and no key material reaches
      # a browser or the client bundle. Deliberately allowed to be empty — with no
      # key the donate page says donations are not open yet, rather than failing at
      # the moment someone tries to give.
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      # `LEARN_BRIDGE_SECRET` WAS HERE AND IS GONE. It gated /api/learn-bridge/account, the endpoint
      # the courses app called on signup so one account worked on both sites.
      #
      # It was removed in the same change as its only caller, which is the rule the earlier version of
      # this comment set out: deleting one without the other breaks signup one way round and leaves a
      # live unused route the other. `learn.ozituma.com` has now been retired entire — Worker, DNS and
      # Supabase project all deleted — so the route, the shared secret and the Supabase mirror in
      # `packages/db` went with it. Do not reintroduce any of them for the retired host; the Academy
      # that replaces it will need its own arrangement, designed rather than inherited.
      # Mail. The only thing Ozituma sends is a password-recovery link, and it is
      # the one message whose failure locks somebody out of their own account.
      #
      # These have to be listed HERE. Compose passes a service only the variables
      # the service names, so adding them to /opt/ozituma/.env is not enough — and
      # the symptom of forgetting is not an error but a page that says email is not
      # switched on while the credentials sit in the environment file unused.
      #
      # Either transport will do. SMTP wins when it is set, because a mailbox is the
      # one an operator has deliberately configured for this site; the AWS variables
      # are otherwise on the box for the media bucket and would be picked up by
      # accident. Both are allowed to be empty: the recovery form then says so
      # plainly and an administrator hands the link over instead.
      OZITUMA_MAIL_FROM: ${OZITUMA_MAIL_FROM:-}
      OZITUMA_SMTP_HOST: ${OZITUMA_SMTP_HOST:-}
      OZITUMA_SMTP_PORT: ${OZITUMA_SMTP_PORT:-}
      OZITUMA_SMTP_USER: ${OZITUMA_SMTP_USER:-}
      OZITUMA_SMTP_PASSWORD: ${OZITUMA_SMTP_PASSWORD:-}
      # RESEND IS THE TRANSPORT `mail.ts` TRIES FIRST, AND IT WAS NOT NAMED.
      #
      # The note above says mail is "the one message whose failure locks somebody out of their own
      # account" — and then lists only SMTP and SES, in the order the code tries them LAST. Adding
      # the preferred transport is what makes that note true rather than aspirational.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OZIKORO_MAIL_FROM: ${OZIKORO_MAIL_FROM:-}
      # The shared session cookie domain. `packages/db/src/accounts.ts` reads it; the `learn`
      # service used to be given it and this one was not. Left empty by default, which is the
      # host-only behaviour the dictionary has today — naming it is what lets the operator widen
      # the cookie to `.ozituma.com` without a compose edit.
      OZITUMA_AUTH_COOKIE_DOMAIN: ${OZITUMA_AUTH_COOKIE_DOMAIN:-}
      # SUPABASE_URL AND SUPABASE_SERVICE_ROLE_KEY WERE HERE AND ARE DELETED, IN THE SAME CHANGE AS
      # THE CODE THAT READ THEM. `registerAccount` no longer reaches a second system: the mirror,
      # `packages/db/src/supabase-mirror.ts`, went with the Supabase project when `learn.ozituma.com`
      # was retired entire on 2026-10-04.
      #
      # They are recorded rather than silently dropped because naming a variable is not free. The
      # dictionary's accounts now live in exactly one place — the `account` table in its own
      # PostgreSQL — and an orphaned name here would read as a second system that still exists.
      # `scripts/check-compose-env.mjs` would have named them, and did, which is how they were found
      # after the deletion.
      OZITUMA_EHLO_NAME: ${OZITUMA_EHLO_NAME:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    expose:
      - '3000'
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ---------------------------------------------------------------------------
  # The archive — ozikoro.com
  #
  # Its own build target, so `--target ozikoro` never builds the dictionary or the academy. Shares the
  # one postgres service and the one account table with them: three sites, one database, which is the
  # requirement this project has held to throughout.
  # ---------------------------------------------------------------------------
  ozikoro:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ozikoro
    image: ozikoro-site:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ozituma:${POSTGRES_PASSWORD}@postgres:5432/ozituma
      OZIKORO_SITE_URL: ${OZIKORO_SITE_URL:-https://ozikoro.com}
      # THE DICTIONARY'S ADDRESS, WHICH THE ARCHIVE'S OWN AUTH ROUTE READS.
      #
      # `apps/ozikoro/app/api/auth/[action]/route.ts` reads `process.env.OZITUMA_SITE_URL` to build
      # the sign-in and password-recovery links it hands to a member. It was NOT passed here, so on
      # the host that variable would be absent and the links built from it would be wrong or empty
      # — while every page still rendered, which is why the omission is worth a paragraph rather
      # than a line. The courses service was given it; the archive shares the account
      # table with the dictionary and now has the address too.
      #
      # COMPOSE PASSES A SERVICE ONLY THE VARIABLES THE SERVICE NAMES. Adding this to
      # /opt/ozituma/.env is not enough on its own — that is the fault `AGENTS.md` records for
      # LEARN_BRIDGE_SECRET, and it costs an afternoon every time it is rediscovered.
      OZITUMA_SITE_URL: ${OZITUMA_SITE_URL:-https://ozituma.com}
      NODE_ENV: production
      # Enables the detailed branch of /api/health, as scripts/build-standalone.sh documents. Left
      # empty by default: with no token the endpoint answers the plain check, which is all the
      # healthcheck and healthwatch need, and no token has to exist for the site to run.
      HEALTH_TOKEN: ${HEALTH_TOKEN:-}
      # ---------------------------------------------------------------------------------------
      # Narration — ElevenLabs
      #
      # THE THREE NAMES THAT WERE IN THE WRONG FILE.
      #
      # `apps/ozikoro/lib/elevenlabs.ts` reads `process.env.ELEVENLABS_API_KEY`,
      # `process.env.ELEVENLABS_VOICE_ID_OWN` and `process.env.ELEVENLABS_VOICE_ID_GENERIC`. They
      # exist only in the REPOSITORY ROOT `.env.local`, which Next.js never loads for an app rooted
      # at `apps/ozikoro` — and which `.dockerignore` excludes from the image anyway (`.env.*`), so
      # they are unreachable on the host by two independent routes.
      #
      # The symptom is not an error. `/admin/audio/` renders normally and says narration is not
      # configured, while the key sits in a file nobody can see; the narration gate answers 503 and
      # a page reads that as "not set up yet". Naming them here is what makes them gettable.
      #
      # All three are allowed to be empty, and must be: with no key the admin screen says narration
      # is unavailable rather than failing when somebody clicks Render, which is the same reasoning
      # the donation key is given above.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID_OWN: ${ELEVENLABS_VOICE_ID_OWN:-}
      ELEVENLABS_VOICE_ID_GENERIC: ${ELEVENLABS_VOICE_ID_GENERIC:-}
      # ---------------------------------------------------------------------------------------
      # Spotify — the archive's own catalogues
      #
      # Read by `packages/ozikoro/src/connection.ts` through `readSpotifyConfig(process.env)`.
      # These live in `apps/ozikoro/.env.local`, which `next dev` DOES load and the image does NOT
      # carry, so the feature works in development and is absent in production unless listed here.
      # `SPOTIFY_SCOPES` is deliberately not listed: the code applies its own default and an empty
      # value would be read as a deliberate empty scope list.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      SPOTIFY_TOKEN_KEY: ${SPOTIFY_TOKEN_KEY:-}
      # ---------------------------------------------------------------------------------------
      # Donations — NOWPayments
      #
      # THE WEBHOOK FAILED CLOSED ON A HOST WHERE THE SECRET WAS ALREADY SET.
      #
      # `apps/ozikoro/lib/nowpayments.ts` reads `process.env.NOWPAYMENTS_IPN_SECRET` and
      # `process.env.NOWPAYMENTS_API_KEY`. Neither was named here, so the container never received
      # them however carefully `/opt/ozituma/.env` was filled in — and the route's refusal to trust
      # an unverifiable call is correct, so the observable result was a **503 on every IPN callback**
      # and a donation that took the money and was never recorded.
      #
      # `NOWPAYMENTS_IPN_SECRET` must stay allowed to be empty for the same reason `LEARN_BRIDGE_SECRET`
      # is: a webhook that cannot verify its caller must refuse rather than accept. Empty means
      # donations are closed and say so.
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      # The shared session cookie domain, read by `packages/db/src/accounts.ts`. The archive shares
      # the one account table with the dictionary, so it needs the same setting the dictionary has.
      OZITUMA_AUTH_COOKIE_DOMAIN: ${OZITUMA_AUTH_COOKIE_DOMAIN:-}
      # The archive's own sign-up route calls `registerAccount`, and as of 2026-10-04 that writes to
      # exactly one place: the `account` table in this compose's own Postgres. `SUPABASE_URL` and
      # `SUPABASE_SERVICE_ROLE_KEY` were named here for the mirror and are deleted. See the longer
      # note on the dictionary's service above.
      # Media. The archive self-hosts 3,437 files and hotlinks 51; the same S3-compatible store the
      # dictionary uses is where the bytes go, so the variables have the same names.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL}
      # Mail, read by @ozituma/core since round 178 moved the SMTP client there. Left empty by default:
      # with no SMTP configured the archive sends nothing rather than failing when it tries.
      #
      # `OZITUMA_SMTP_PASS` WAS ONE LETTER SHORT OF THE NAME THE CODE READS.
      #
      # `packages/core/src/mail.ts` reads `OZITUMA_SMTP_PASSWORD` — spelled out, like the dictionary
      # service above has always spelled it. This block said `OZITUMA_SMTP_PASS`, so the container
      # received a variable nothing reads and the transport got a null password. **A password the
      # operator had configured, sitting in the container's environment under a name the client
      # never asked for**, which presents as an authentication failure against the mailbox rather
      # than as a missing setting. Corrected to the name the code reads; the old spelling is not
      # kept as an alias, because two names for one secret is how the next one gets missed.
      OZITUMA_SMTP_HOST: ${OZITUMA_SMTP_HOST:-}
      OZITUMA_SMTP_PORT: ${OZITUMA_SMTP_PORT:-}
      OZITUMA_SMTP_USER: ${OZITUMA_SMTP_USER:-}
      OZITUMA_SMTP_PASSWORD: ${OZITUMA_SMTP_PASSWORD:-}
      # The sender, in the order `mail.ts` resolves it: OZIKORO_MAIL_FROM, then OZITUMA_MAIL_FROM.
      # Both were in `apps/ozikoro/.env.local` only, which `.dockerignore` excludes from the image,
      # so the archive had no From address on the host. With neither, the recovery mail refuses with
      # "No From address" and the operator sees a working form that sends nothing.
      OZIKORO_MAIL_FROM: ${OZIKORO_MAIL_FROM:-}
      OZITUMA_MAIL_FROM: ${OZITUMA_MAIL_FROM:-}
      # Resend is the preferred transport — `mail.ts` tries it before SMTP. Also in the app-dir
      # `.env.local` and therefore also unreachable on the host until it is named here.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OZITUMA_EHLO_NAME: ${OZITUMA_EHLO_NAME:-}
    # Named for the same reason the dictionary and the courses name it: it is the port Caddy
    # proxies to, and a reader should not have to derive it from the Dockerfile. `expose` is
    # metadata and does not itself open or close anything on the compose network.
    expose:
      - '3000'
    healthcheck:
      # The archive has had a health endpoint since the vertical slice. Curl is in the node:24-alpine
      # base only if apk added it, so this asks with node instead of assuming a tool.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  # THE `learn` SERVICE IS GONE, AND SO IS THE APP IT RAN.
  #
  # `ozituma-learn:latest` was the legacy Next.js courses app in `apps/learn`, served at
  # `learn.ozituma.com`. Three things retired it in turn: the Cloudflare Worker took the subdomain, the
  # `learn` CNAME was deleted, and the host itself is now being retired in favour of
  # `academy.ozikoro.com`. So the app, its Dockerfile target and this service are removed together.
  #
  # **WHAT WAS NOT TOUCHED, AND MUST NOT BE FROM HERE:** the running Cloudflare Worker
  # (`tanstack-start-ts-learn`), its DNS, and its Supabase project. The subdomain still answers; taking
  # the source out of this repository does not take it down, and a deleted Worker with data behind it
  # is not something this file should be able to do.
  #
  # **THAT WORKER IS NOW GONE TOO.** `learn.ozituma.com` was retired entire — the Worker, its custom
  # domain and its Supabase project — and the `learn/` source tree was deleted. So the bridge endpoint,
  # `LEARN_BRIDGE_SECRET` and the Supabase mirror were removed in the same change, which is the rule
  # this note used to state for the future.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # The Academy — academy.ozikoro.com
  #
  # The learning layer, and the successor to the retired learn.ozituma.com. It is the fourth site
  # behind the one Caddy, and like the archive it shares nothing with the other two but the proxy.
  #
  # ITS OWN IMAGE, BUILT FROM ITS OWN DIRECTORY. This is the one service here whose source is not a
  # Next.js workspace: the Academy is TanStack Start on Vite, so its build context is `apps/academy`
  # and its dependencies come from that directory's own lockfile. See the header of
  # apps/academy/Dockerfile for why folding it into the shared root `npm ci` was refused.
  #
  # IT IS ALSO THE ONE SERVICE THAT NEEDS NO DATABASE. Every page is served from the app's own data
  # module — there is no connection string below, no `depends_on: postgres`, and that absence is
  # accurate rather than an oversight. When the mastery engine and enrolment arrive, they come with
  # the DATABASE_URL and the dependency, together.
  # ---------------------------------------------------------------------------
  academy:
    build:
      # The repository root is the wrong context here on purpose: see the Dockerfile's header.
      context: ../apps/academy
      dockerfile: Dockerfile
    image: ozikoro-academy:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The port Caddy proxies to. Named rather than defaulted, because the Dockerfile's EXPOSE and
      # the Caddyfile's `reverse_proxy academy:3000` are three places that must agree.
      PORT: '3000'
      HOST: '0.0.0.0'
    expose:
      - '3000'
    healthcheck:
      # The Academy has no health route, so this asks `/`. A 200 there proves the SSR handler, the
      # route tree and the static asset layer all loaded — a stronger statement than a handler that
      # only proves the process is listening.
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ---------------------------------------------------------------------------
  # Backups — the one service whose absence is discovered on the worst day
  #
  # THE LOCAL BACKUP TOOL CANNOT DO THIS JOB, BY ITS OWN DESIGN. `takeBackup` in
  # packages/ozikoro/src/ops/backup.ts refuses outright when DATABASE_URL is set:
  #
  #   "DATABASE_URL is set, so this is a server Postgres, not a local PGlite cluster.
  #    Copying the cluster directory would produce a backup that does not restore.
  #    Use pg_dump."
  #
  # That guard is right, and it means production backups are pg_dump or they are nothing. This service
  # is the pg_dump. It runs the same postgres image as the database rather than adding a second
  # client's version skew, and it writes to a volume that is not the database's own — a backup on the
  # same disk as the thing it backs up is not a backup.
  #
  # `--format=custom` rather than a plain SQL dump: it compresses, and it restores selectively with
  # pg_restore, which is what makes a partial recovery possible rather than all-or-nothing.
  #
  # Retention is 14 days by find -mtime, deliberately simple and legible. Nothing prunes by name, so
  # a dump that fails to appear cannot be mistaken for one that was rotated away.
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backupdata:/backups
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        echo "backup: starting; dumps land in /backups"
        while true; do
          stamp=$$(date -u +%Y-%m-%dT%H-%M-%SZ)
          out="/backups/ozituma-$$stamp.dump"
          if pg_dump -h postgres -U ozituma -d ozituma --format=custom --file="$$out"; then
            # A dump is only a backup if it can be read back. pg_restore --list parses the archive
            # header and the table of contents; a truncated file fails here rather than at restore time.
            if pg_restore --list "$$out" > /dev/null 2>&1; then
              size=$$(wc -c < "$$out")
              echo "backup: ok $$out ($$size bytes, restored-header verified)"
            else
              echo "backup: FAILED verification for $$out — leaving it in place for inspection"
            fi
          else
            echo "backup: pg_dump FAILED at $$stamp"
          fi
          find /backups -name 'ozituma-*.dump' -mtime +14 -delete
          sleep 86400
        done

  # ---------------------------------------------------------------------------
  # Health watch — one request per site per interval, logged
  #
  # Not a metrics stack. The archive runs on one host and the question worth answering automatically is
  # the plain one: is each of the three sites answering. The compose healthchecks already restart a
  # container that stops responding, and this records that it did.
  # ---------------------------------------------------------------------------
  healthwatch:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - web
      - ozikoro
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache curl > /dev/null 2>&1 || true
        while true; do
          for pair in "ozituma.com http://web:3000" "ozikoro.com http://ozikoro:3000"; do
            name=$${pair%% *}; url=$${pair#* }
            code=$$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$$url/api/health" || echo 000)
            echo "healthwatch: $$name -> $$code"
          done
          sleep 300
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # `ozikoro` IS IN THIS LIST, AND ITS ABSENCE WAS A FAULT IN TWO PARTS.
    #
    # The Caddyfile has carried an `{$OZIKORO_DOMAIN}` site block for some time, but this service
    # was never given `OZIKORO_DOMAIN` and never depended on `ozikoro`. Compose passes a service
    # only the variables it names — the fault `AGENTS.md` records for LEARN_BRIDGE_SECRET — so on
    # the host Caddy resolved `{$OZIKORO_DOMAIN}` to the EMPTY STRING.
    #
    # THAT IS WORSE THAN A MISSING SITE. Caddy requires every site block to have an address; a
    # block whose address interpolates to nothing is a configuration Caddy refuses to load. So the
    # fault does not merely leave ozikoro.com unserved — **it stops Caddy starting, which takes
    # ozituma.com down with it.** The default below is therefore not a convenience: it makes an
    # unset variable impossible to reach the interpolation.
    depends_on:
      - web
      # Listed so the reverse proxy's target exists before Caddy starts. Without it the first
      # request to ozikoro.com can be proxied to a name that has not been created yet.
      - ozikoro
      # The same reasoning, for the same fault, a third time: `{$ACADEMY_DOMAIN}` is interpolated in
      # the Caddyfile, and a block whose address resolves to nothing stops Caddy loading entirely.
      - academy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin CA certificate. Valid ~15 years and trusted by
      # Cloudflare, so there is no renewal loop to run on the host.
      #
      # ONE FILE SERVES BOTH SITES, AND A CLOUDFLARE ORIGIN CA CERTIFICATE IS ISSUED FOR NAMED
      # HOSTS. If this certificate's SANs do not include `ozikoro.com` and `www.ozikoro.com`, then
      # the Cloudflare-to-origin hop verifies only while the zone's SSL mode is **Full** (which does
      # not validate the origin certificate). Under **Full (strict)** it is refused and ozikoro.com
      # answers 526. The zone is recorded as `full` today, and the Caddyfile's own header says
      # `full (strict)` is the intent — so the certificate must be checked for ozikoro.com before
      # the zone is ever raised, or the raise takes the site down. The operator's check:
      #
      #   openssl x509 -in /opt/ozituma/certs/origin.pem -noout -text | grep -A1 'Subject Alternative Name'
      #
      - /opt/ozituma/certs:/etc/caddy/certs:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      OZITUMA_DOMAIN: ${OZITUMA_DOMAIN:-ozituma.com}
      # The second domain the Caddyfile interpolates. Without it Caddy will not load at all — see
      # the note on `depends_on` above.
      OZIKORO_DOMAIN: ${OZIKORO_DOMAIN:-ozikoro.com}
      # The third. `ACADEMY_DOMAIN` is a hostname under the ozikoro.com zone rather than a zone of
      # its own, so it is deliberately not derived from OZIKORO_DOMAIN: the Academy's address is a
      # property of the Academy, and a `academy.${OZIKORO_DOMAIN}` expression would make it
      # impossible to move one without moving the other. The default matches production, so an
      # unset variable cannot reach the interpolation.
      ACADEMY_DOMAIN: ${ACADEMY_DOMAIN:-academy.ozikoro.com}
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

volumes:
  caddydata:
  caddyconfig:
  backupdata:
