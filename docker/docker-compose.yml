# Ozituma — local development stack.
#
# This exists because PGlite (the zero-install local database) is
# single-process: the dev server and a CLI script cannot share one data
# directory. The moment you want to run a migration or an import while the app
# is up — or you want pg_trgm, which PGlite does not ship — you need a real
# Postgres. That is this file.
#
#   docker compose -f docker/docker-compose.yml up -d
#   export DATABASE_URL=postgres://ozituma:ozituma@localhost:5432/ozituma
#   npm run db:migrate && npm run seed && npm run import:igbo
#   npm run dev
#
# MinIO provides S3-compatible object storage so the audio pipeline can be
# developed against the same API shape it will use on AWS S3.

name: ozituma

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ozituma
      POSTGRES_PASSWORD: ozituma
      POSTGRES_DB: ozituma
      # C collation keeps ORDER BY stable and index-friendly for the
      # diacritic-bearing headwords we sort.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ozituma -d ozituma']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for pronunciation audio and document uploads.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ozituma
      MINIO_ROOT_PASSWORD: ozituma-dev-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the media bucket on first boot.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ozituma ozituma-dev-secret &&
      mc mb --ignore-existing local/ozituma-media &&
      mc anonymous set download local/ozituma-media &&
      echo 'media bucket ready'
      "

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ozituma:ozituma@postgres:5432/ozituma
      OZITUMA_SITE_URL: ${OZITUMA_SITE_URL:-http://localhost:3000}
      # S3-compatible storage. Point these at real S3 in production; the code
      # path is identical.
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ozituma-media
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ozituma
      S3_SECRET_ACCESS_KEY: ozituma-dev-secret
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '3000:3000'

volumes:
  pgdata:
  miniodata:
