<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Ozituma Learn</title>
<!--
  Shown when a navigation fails with no network.

  Deliberately NOT a cached copy of the app. Serving a stale shell here is exactly the bug this
  project spent three rounds fixing, and a service worker doing it would survive every deploy and be
  almost impossible for a learner to clear. This page says what is true and offers a retry.
-->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#F6EEDD; color:#1E1B16;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:24px; }
  .card { max-width:28rem; text-align:center; }
  img { height:40px; width:auto; margin:0 auto 24px; display:block; }
  h1 { font-size:1.5rem; margin:0 0 12px; }
  p { margin:0 0 8px; line-height:1.6; color:#5b5348; }
  a { display:inline-block; margin-top:24px; padding:14px 28px; background:#C8792B; color:#fff;
      text-decoration:none; border-radius:8px; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <img src="/brand/ozituma-horizontal-color.svg" alt="Ozituma">
    <h1>You are offline</h1>
    <p>Ozituma Learn needs a connection to load lessons and your review schedule.</p>
    <p>Anything already saved on this device is still here — it will sync when you reconnect.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
